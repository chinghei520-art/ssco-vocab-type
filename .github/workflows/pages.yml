name: Deploy GitHub Pages

# The live site is published from the main branch root (legacy Pages).
# GITHUB_TOKEN cannot create that site; it can only deploy when Source is
# GitHub Actions. This workflow keeps pages:write and id-token:write, and
# deploys only in that case so a branch publish is left alone.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect Pages build type
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          build=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type)
          echo "build_type=${build}" | tee -a "$GITHUB_OUTPUT"
          if [ "${build}" = "legacy" ]; then
            echo "Pages already publishes the main branch root. Skipping Actions deploy."
          fi

      - name: Configure GitHub Pages
        if: steps.mode.outputs.build_type == 'workflow'
        uses: actions/configure-pages@v6

      - name: Prepare site root
        if: steps.mode.outputs.build_type == 'workflow'
        run: |
          mkdir -p _site
          cp index.html vocab.js vocab.json README.md VERSION .nojekyll _site/

      - name: Upload Pages artifact
        if: steps.mode.outputs.build_type == 'workflow'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.mode.outputs.build_type == 'workflow'
        uses: actions/deploy-pages@v5
