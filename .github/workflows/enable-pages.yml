name: Enable GitHub Pages

# One-shot: the cloud-agent GitHub App token cannot create a Pages site
# (needs pages=write or administration=write). GITHUB_TOKEN in Actions can
# hold pages=write, so this job asks GitHub to publish main / as a legacy site.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Publish from the main branch root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/pages" \
            -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}')
          echo "HTTP ${code}"
          cat /tmp/pages.json
          echo
          case "${code}" in
            201|409) exit 0 ;;
            *) exit 1 ;;
          esac
